name: Sync YNAB dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [ynab-sync]

concurrency:
  group: ynab-dashboard-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Pull YNAB and build dashboard
        env:
          YNAB_TOKEN: ${{ secrets.YNAB_TOKEN }}
        run: |
          if [ -z "$YNAB_TOKEN" ]; then
            echo "YNAB_TOKEN is not configured in repository secrets."
            exit 1
          fi
          mkdir -p pages-deploy
          python ynab_sync.py --months 36 --out pages-deploy/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Publish the refreshed dashboard to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment secrets are not configured."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy pages-deploy --project-name ynab-ledger-dashboard --branch main
